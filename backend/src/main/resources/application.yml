server:
  port: 8080

spring:
  application:
    name: urban-shopper

  # Default: H2 in-memory (zero infrastructure)
  # Switch to PostgreSQL via: --spring.profiles.active=postgres
  datasource:
    url: jdbc:h2:mem:urbanshopper;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # H2 compatibility mode
    placeholders:
      schema: PUBLIC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE

  # Disable RabbitMQ auto-config until needed
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

jwt:
  secret: ${JWT_SECRET:dev-jwt-secret-change-in-production}
  access-token-expiration: 1800
  refresh-token-expiration: 604800

sms:
  provider: africastalking
  api-key: ${SMS_API_KEY:}
  api-secret: ${SMS_API_SECRET:}
  sender-id: UrbanShop

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.urbanshopper: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
---
# PostgreSQL profile: spring.profiles.active=postgres
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urbanshopper}
    username: ${DB_USER:urbanshopper}
    password: ${DB_PASSWORD:urbanshopper_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    placeholders:
      schema: user_service

  autoconfigure:
    exclude:
