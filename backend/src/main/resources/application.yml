server:
  port: 8080

spring:
  application:
    name: urban-shopper

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urbanshopper}
    username: ${DB_USER:urbanshopper}
    password: ${DB_PASSWORD:urbanshopper_dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:urbanshopper}
    password: ${RABBITMQ_PASSWORD:urbanshopper_dev}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE

jwt:
  secret: ${JWT_SECRET:dev-jwt-secret-do-not-use-in-production}
  access-token-expiration: 1800
  refresh-token-expiration: 604800

sms:
  provider: africastalking
  api-key: ${SMS_API_KEY}
  api-secret: ${SMS_API_SECRET}
  sender-id: UrbanShop

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.urbanshopper: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
